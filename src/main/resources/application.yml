spring:
  application:
    name: FireRisk
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/css,text/javascript,application/javascript,text/html

firerisk:
  # Chave da NASA FIRMS. Vem de .env ou das variaveis de ambiente.
  firms:
    api-key: ${NASA_FIRMS_KEY:}
  # Malha municipal do IBGE; baixada automaticamente se o arquivo nao existir.
  geojson-path: data/raw/municipios.geojson
  # Dados salvos para quando as APIs nao respondem (gerados com --cli --snapshot).
  snapshot-dir: data/snapshot

logging:
  level:
    root: INFO
    com.firerisk: INFO
